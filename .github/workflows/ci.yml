name: CI
run-name: >-
  ${{ github.event_name == 'push' && vars.CI_RUN_ON_PUSH == 'false' && 'CI / push skipped' ||
      (!github.event.repository.private || github.event_name != 'workflow_dispatch' ||
       inputs.hosted || !(vars.CI_LINUX_RUNNER || vars.CI_MACOS_RUNNER || vars.CI_WINDOWS_RUNNER)) &&
      'CI / hosted' || inputs.full_tests && 'CI / local (full)' || 'CI / local' }}

on:
  pull_request:
  push:
    # Publications push a branch and tags together; test the branch once.
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      hosted:
        description: Run the complete publication checks on GitHub-hosted runners
        type: boolean
        default: true
      full_tests:
        description: Include slow tests on local runners
        type: boolean
        default: false

# A newer requested run on a branch supersedes the older one. Each push run
# has its own group: the release workflow needs the tagged commit's push run.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('ci-dispatch-{0}', github.ref)
        || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_HOSTED: >-
    ${{ !github.event.repository.private || github.event_name != 'workflow_dispatch' ||
        inputs.hosted || !(vars.CI_LINUX_RUNNER || vars.CI_MACOS_RUNNER || vars.CI_WINDOWS_RUNNER) }}
  CI_IMPORT: docwrap
  BIOME_VERSION: 2.5.14
  UV_PYTHON_DOWNLOADS: never
  UV_SYSTEM_PYTHON: "0"
  UV_VERSION: 0.12.23

defaults:
  run:
    shell: bash

jobs:
  quality:
    if: github.event_name != 'push' || vars.CI_RUN_ON_PUSH != 'false'
    runs-on: >-
      ${{ github.event.repository.private && github.event_name == 'workflow_dispatch' &&
          !inputs.hosted && vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Verify execution environment
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          printf 'Runner: %s; OS: %s; architecture: %s\n' \
            "$CI_RUNNER_ENVIRONMENT" "$CI_RUNNER_OS" "$CI_RUNNER_ARCH"
          if [ "$CI_HOSTED" = true ]; then
            test "$CI_RUNNER_ENVIRONMENT" = github-hosted
          fi
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          architecture: >-
            ${{ runner.environment == 'self-hosted' && runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}
      - name: Set up Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: ${{ env.BIOME_VERSION }}
      - name: Set up locked development environment
        run: make setup
      - name: Set up Markdown formatters
        env:
          SHFMT_VERSION: 3.14.1
          TAPLO_VERSION: 0.10.0
        run: |
          case "$RUNNER_ARCH" in
            ARM64)
              architecture=aarch64
              taplo_checksum=033681d01eec8376c3fd38fa3703c79316f5e14bb013d859943b60a07bccdcc3
              shfmt_architecture=arm64
              shfmt_checksum=5f2db09dae91fca848f7adbdd014632e921a383863a2ad7e0450ad3aba0c6489
              ;;
            X64)
              architecture=x86_64
              taplo_checksum=8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156
              shfmt_architecture=amd64
              shfmt_checksum=76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
              ;;
            *) echo "Unsupported formatter architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/markdown-formatters"
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/tamasfe/taplo/releases/download/$TAPLO_VERSION/taplo-linux-$architecture.gz" \
            --output "$RUNNER_TEMP/taplo.gz"
          printf '%s  %s\n' "$taplo_checksum" "$RUNNER_TEMP/taplo.gz" | sha256sum --check --status
          gzip -dc "$RUNNER_TEMP/taplo.gz" > "$RUNNER_TEMP/markdown-formatters/taplo"
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/mvdan/sh/releases/download/v$SHFMT_VERSION/shfmt_v${SHFMT_VERSION}_linux_$shfmt_architecture" \
            --output "$RUNNER_TEMP/markdown-formatters/shfmt"
          printf '%s  %s\n' "$shfmt_checksum" "$RUNNER_TEMP/markdown-formatters/shfmt" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/markdown-formatters/taplo" "$RUNNER_TEMP/markdown-formatters/shfmt"
          "$RUNNER_TEMP/markdown-formatters/taplo" --version
          "$RUNNER_TEMP/markdown-formatters/shfmt" --version
          echo "$RUNNER_TEMP/markdown-formatters" >> "$GITHUB_PATH"
      - name: Check quality
        run: make quality
      - name: Check worktree
        run: git diff --exit-code

  test:
    needs: quality
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.13"
          - os: ubuntu-24.04
            python-version: "3.14"
          - os: ubuntu-24.04
            python-version: "3.15"
          - os: macos-15
            python-version: "3.13"
          - os: windows-2022
            python-version: "3.13"
    runs-on: >-
      ${{ github.event.repository.private && github.event_name == 'workflow_dispatch' &&
          !inputs.hosted &&
          (matrix.os == 'ubuntu-24.04' && vars.CI_LINUX_RUNNER ||
           matrix.os == 'macos-15' && vars.CI_MACOS_RUNNER ||
           matrix.os == 'windows-2022' && vars.CI_WINDOWS_RUNNER) || matrix.os }}
    steps:
      - name: Verify execution environment
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          printf 'Runner: %s; OS: %s; architecture: %s\n' \
            "$CI_RUNNER_ENVIRONMENT" "$CI_RUNNER_OS" "$CI_RUNNER_ARCH"
          if [ "$CI_HOSTED" = true ]; then
            test "$CI_RUNNER_ENVIRONMENT" = github-hosted
          fi
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          architecture: >-
            ${{ (matrix.os == 'macos-15' ||
                 (runner.environment == 'self-hosted' && runner.arch == 'ARM64')) && 'arm64' || 'x64' }}
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.python-version == '3.15' }}
      - name: Record Python environment
        run: >-
          python -c "import platform, sysconfig;
          print('Python:', platform.python_version());
          print('Platform:', sysconfig.get_platform())"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}
      - name: Create test environment
        run: |
          uv venv --python python --no-python-downloads .venv
          python - <<'PY'
          import os
          from pathlib import Path

          scripts = 'Scripts' if os.name == 'nt' else 'bin'
          with Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8') as output:
              output.write(f'{Path.cwd() / ".venv" / scripts}\n')
          PY
      - name: Install locked test dependencies
        run: |
          python -c 'import sys; assert sys.prefix != sys.base_prefix'
          uv pip sync --python python --no-python-downloads --require-hashes --build-constraints requirements-ci.txt requirements-test.txt
          uv pip install --python python --no-python-downloads --no-deps --no-build-isolation -e .
      - name: Run tests
        env:
          CI_QUICK_TESTS: >-
            ${{ runner.environment == 'self-hosted' && runner.os != 'Linux' &&
                !inputs.full_tests }}
        run: |
          selection=()
          if [ "$CI_QUICK_TESTS" = true ]; then
            selection=(-m 'not slow')
          fi
          python -m pytest -q -n auto --dist worksteal --durations=15 "${selection[@]}"

  hooks:
    needs: quality
    runs-on: >-
      ${{ github.event.repository.private && github.event_name == 'workflow_dispatch' &&
          !inputs.hosted && vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    env:
      UV_SYSTEM_PYTHON: "0"
    steps:
      - name: Verify execution environment
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          printf 'Runner: %s; OS: %s; architecture: %s\n' \
            "$CI_RUNNER_ENVIRONMENT" "$CI_RUNNER_OS" "$CI_RUNNER_ARCH"
          if [ "$CI_HOSTED" = true ]; then
            test "$CI_RUNNER_ENVIRONMENT" = github-hosted
          fi
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          architecture: >-
            ${{ runner.environment == 'self-hosted' && runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}
      - name: Set up locked development environment
        run: |
          make setup
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Smoke-test pre-commit hooks
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          python - <<'PY_CONSTRAINTS'
          import os
          from pathlib import Path

          source = Path('requirements-ci.txt').read_text(encoding='utf-8')
          lines = []
          for line in source.splitlines():
              if line.lstrip().startswith('--hash='):
                  continue
              lines.append(line.removesuffix(' \\'))
          path = Path(os.environ['RUNNER_TEMP']) / 'ci-constraints.txt'
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY_CONSTRAINTS
          export PIP_CONSTRAINT="$RUNNER_TEMP/ci-constraints.txt"
          export PIP_BUILD_CONSTRAINT="$PIP_CONSTRAINT"
          export VIRTUALENV_NO_PERIODIC_UPDATE=1
          export VIRTUALENV_DOWNLOAD=0
          cd "$consumer"
          git init
          git config user.name "docwrap CI"
          git config user.email "ci@example.invalid"
          printf '%s\n' \
            'def sample():' \
            '    """Summary.' \
            '' \
            '    This body line is deliberately much longer than the default line length so both pre-commit hook modes have observable work to perform.' \
            '    """' \
            '    pass' > sample.py
          git add sample.py
          before="$(sha256sum sample.py)"

          if pre-commit try-repo "$GITHUB_WORKSPACE" docwrap-check --all-files; then
            echo "docwrap-check unexpectedly succeeded on nonconforming input" >&2
            exit 1
          else
            check_status=$?
          fi
          test "$check_status" -eq 1
          after_check="$(sha256sum sample.py)"
          test "$after_check" = "$before"

          if pre-commit try-repo "$GITHUB_WORKSPACE" docwrap --all-files; then
            echo "docwrap autofix unexpectedly succeeded while modifying input" >&2
            exit 1
          else
            fix_status=$?
          fi
          test "$fix_status" -eq 1
          after_fix="$(sha256sum sample.py)"
          test "$after_fix" != "$before"

          git add sample.py
          pre-commit try-repo "$GITHUB_WORKSPACE" docwrap --all-files
          pre-commit try-repo "$GITHUB_WORKSPACE" docwrap-check --all-files

  package:
    needs: [quality, test, hooks]
    runs-on: >-
      ${{ github.event.repository.private && github.event_name == 'workflow_dispatch' &&
          !inputs.hosted && vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    env:
      UV_SYSTEM_PYTHON: "0"
    steps:
      - name: Verify execution environment
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          printf 'Runner: %s; OS: %s; architecture: %s\n' \
            "$CI_RUNNER_ENVIRONMENT" "$CI_RUNNER_OS" "$CI_RUNNER_ARCH"
          if [ "$CI_HOSTED" = true ]; then
            test "$CI_RUNNER_ENVIRONMENT" = github-hosted
          fi
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          architecture: >-
            ${{ runner.environment == 'self-hosted' && runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}
      - name: Build distributions
        run: uv build --python python --no-python-downloads --build-constraints requirements-ci.txt --require-hashes
      - name: Audit distributions
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path, PurePosixPath

          dist = Path('dist')
          wheels = list(dist.glob('*.whl'))
          sdists = list(dist.glob('*.tar.gz'))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          allowed_roots = {
              '.gitignore',
              '_build.py',
              'plugins',
              'src',
              'README.md',
              'LICENSE',
              'pyproject.toml',
              'PKG-INFO',
          }

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              dist_info = {PurePosixPath(n).parts[0] for n in names if '.dist-info/' in n}
              allowed_wheel_roots = {'docwrap', 'plugins', *dist_info}
              archives = [(archive.filename, names, False)]
          with tarfile.open(sdists[0], 'r:gz') as archive:
              archives.append((archive.name, archive.getnames(), True))

          for archive_name, names, strip_sdist_root in archives:
              for raw_name in names:
                  path = PurePosixPath(raw_name)
                  assert not path.is_absolute(), (archive_name, raw_name)
                  assert '..' not in path.parts, (archive_name, raw_name)
                  parts = path.parts[1:] if strip_sdist_root else path.parts
                  if not parts:
                      continue
                  roots = allowed_wheel_roots if not strip_sdist_root else allowed_roots
                  assert parts[0] in roots, (archive_name, raw_name)
                  if not strip_sdist_root and parts[0] == 'plugins':
                      assert len(parts) >= 4, (archive_name, raw_name)
                      assert (Path('plugins') / parts[1] / 'adapter.toml').is_file(), (archive_name, raw_name)
                      assert parts[2] == '_docwrap', (archive_name, raw_name)
                      assert parts[-1].endswith('.py'), (archive_name, raw_name)
          PY
      - name: Create clean installation environment
        run: uv venv --python python --no-python-downloads "$RUNNER_TEMP/package-smoke"
      - name: Install wheel and runtime dependencies
        run: uv pip install --python "$RUNNER_TEMP/package-smoke/bin/python" --no-python-downloads --constraint requirements-ci.txt --build-constraints requirements-ci.txt dist/*.whl
      - name: Smoke-test import
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/package-smoke/bin/python" -I -c "import importlib, os; importlib.import_module(os.environ['CI_IMPORT'])"
      - name: Smoke-test CLI
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/package-smoke/bin/docwrap" --help'
      - name: Load bundled plugin entry points
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/package-smoke/bin/python" -I - <<'PY'
          from importlib.metadata import distribution
          entries = [entry for entry in distribution("docwrap").entry_points
                     if entry.group == "docwrap.hook_adapters"]
          assert entries
          for entry in entries:
              entry.load()
          PY
      - name: Check worktree
        run: git diff --exit-code
      - name: Save distributions
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CI_HOSTED == 'true' && 'python-distributions' || 'local-distributions' }}
          path: dist/
          if-no-files-found: error
          overwrite: true

  hosted-validation:
    if: >-
      ${{ always() &&
          (github.event_name != 'push' || vars.CI_RUN_ON_PUSH != 'false') &&
          (!github.event.repository.private || github.event_name != 'workflow_dispatch' ||
           inputs.hosted || !(vars.CI_LINUX_RUNNER || vars.CI_MACOS_RUNNER || vars.CI_WINDOWS_RUNNER)) }}
    needs: [quality, test, hooks, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete hosted CI
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          HOOKS_RESULT: ${{ needs.hooks.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$CI_RUNNER_ENVIRONMENT" = github-hosted
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$HOOKS_RESULT" = success
          test "$PACKAGE_RESULT" = success
